name: Code checks

on:
  push:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@bd01e18f51369d5a26f1651c3cb451d3417e3bba  # v6.3.1
        with:
          python-version: "3.11"
          enable-cache: "true"

      - name: Ruff format
        run: uvx ruff@0.15.4 format --check --diff permutect/

      - name: Ruff check
        run: uvx ruff@0.15.4 check permutect/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: prefix-dev/setup-pixi@a0af7a228712d6121d37aba47adf55c1332c9c2e  # v0.9.4
        with:
          cache: true

      - name: Run unit tests
        run: pixi run test-unit

  # the default environment locks an older Python, so also test the newest one permutect supports
  test-py313:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: prefix-dev/setup-pixi@a0af7a228712d6121d37aba47adf55c1332c9c2e  # v0.9.4
        with:
          cache: true
          environments: py313

      - name: Run unit tests on Python 3.13
        run: pixi run -e py313 test-unit
